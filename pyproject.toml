[project]
name = "jrl"
version = "1.1.1"
description = "JSON Robot Log"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dan McGann", email = "danmcgann@cmu.edu" }]
keywords = [
    "slam",
    "sam",
    "robotics",
    "localization",
    "mapping",
    "optimization",
]
dependencies = ["numpy>2"]

[dependency-groups]
dev = ["cmake<4.0", "ipython", "pytest", "gtsam-nb==0.1.3"]

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.13", "numpy>2", "gtsam-nb"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = "<4.0"
wheel.packages = ["python/jrl"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "include/**/*.{h,hpp}" },
    { file = "src/**/*.{c,cpp}" },
    { file = "python/**/*.{cpp,py}" },
    { file = "CMakeLists.txt" },
]

[tool.uv.sources]
gtsam-nb = { path = "../gtsam-nb" }
